<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magie">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Magie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100vw; height: 100vh; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; position: fixed; top: 0; left: 0; }
  #bg { position: fixed; top: calc(-1 * env(safe-area-inset-top, 0px)); left: calc(-1 * env(safe-area-inset-left, 0px)); width: calc(100vw + env(safe-area-inset-left, 0px) + env(safe-area-inset-right, 0px)); height: calc(100vh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px)); object-fit: fill; }
  #card { position: fixed; left: 50%; top: 50%; width: 60vw; max-height: 90vh; object-fit: contain; display: none; will-change: transform; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }
  #menu { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.94); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: flex-start; gap: 16px; padding: 40px 24px; overflow-y: auto; touch-action: pan-y; font-family: -apple-system, Helvetica, Arial, sans-serif; z-index: 10; text-align: center; }
  #menu h1 { font-size: 22px; font-weight: 600; margin-top: auto; }
  #menu .btn.ok { margin-bottom: auto; }
  #menu p { font-size: 14px; opacity: 0.7; max-width: 320px; }
  .btn { display: block; width: 280px; padding: 16px; background: #2a2a2e; color: #fff; border-radius: 14px; font-size: 17px; text-align: center; cursor: pointer; }
  .btn.ok { background: #0a84ff; }
  .state { font-size: 13px; opacity: 0.6; margin-top: -10px; }
  .slider-box { width: 280px; text-align: left; font-size: 15px; }
  .slider-box label { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .slider-box input[type=range] { width: 100%; -webkit-user-select: auto; user-select: auto; touch-action: auto; }
  input[type=file] { display: none; }
  #perm { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; color: #fff; display: none; align-items: center; justify-content: center; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 18px; z-index: 20; text-align: center; padding: 30px; }
</style>
</head>
<body>

<img id="bg" alt="">
<img id="card" alt="">

<div id="menu">
  <h1>Réglages</h1>
  <p>Choisis tes images et règle les trois curseurs selon ton effet.</p>
  <label class="btn">Choisir le fond d'écran<input type="file" id="fileBg" accept="image/*"></label>
  <div class="state" id="stBg">Aucun fond choisi</div>
  <label class="btn">Choisir le PNG de la carte<input type="file" id="fileCard" accept="image/png,image/*"></label>
  <div class="state" id="stCard">Aucun PNG choisi</div>
  <div class="slider-box">
    <label><span>Sensibilité de la secousse</span><span id="valShake">5</span></label>
    <input type="range" id="rngShake" min="1" max="10" step="1" value="5">
  </div>
  <div class="slider-box">
    <label><span>Gravité de la carte</span><span id="valMove">5</span></label>
    <input type="range" id="rngMove" min="0" max="10" step="1" value="5">
  </div>
  <div class="slider-box">
    <label><span>Taille de la carte</span><span id="valSize">60</span></label>
    <input type="range" id="rngSize" min="20" max="100" step="1" value="60">
  </div>
  <div class="btn" id="btnInv">Sens de la gravité : normal</div>
  <div class="btn ok" id="btnOk">Valider</div>
</div>

<div id="perm">Touche l'écran pour activer les capteurs de mouvement</div>

<script>
(function () {
  var bg = document.getElementById('bg');
  var card = document.getElementById('card');
  var menu = document.getElementById('menu');
  var perm = document.getElementById('perm');
  var fileBg = document.getElementById('fileBg');
  var fileCard = document.getElementById('fileCard');
  var stBg = document.getElementById('stBg');
  var stCard = document.getElementById('stCard');
  var btnOk = document.getElementById('btnOk');

  // ---------- Stockage local (IndexedDB) ----------
  var dbp = new Promise(function (res, rej) {
    var r = indexedDB.open('magie-db', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('img'); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
  function dbSet(k, v) {
    return dbp.then(function (db) {
      return new Promise(function (res) {
        var t = db.transaction('img', 'readwrite');
        t.objectStore('img').put(v, k);
        t.oncomplete = res;
      });
    });
  }
  function dbGet(k) {
    return dbp.then(function (db) {
      return new Promise(function (res) {
        var q = db.transaction('img').objectStore('img').get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { res(null); };
      });
    });
  }

  var rngShake = document.getElementById('rngShake');
  var rngMove = document.getElementById('rngMove');
  var valShake = document.getElementById('valShake');
  var valMove = document.getElementById('valMove');
  var rngSize = document.getElementById('rngSize');
  var valSize = document.getElementById('valSize');

  // Réglages par défaut (réalistes) : secousse 5, mouvement 5
  var shakeLevel = 5;
  var moveLevel = 5;
  var sizeLevel = 60;  // largeur de la carte en % de la largeur de l'écran
  try {
    var s1 = localStorage.getItem('magie-shake');
    var s2 = localStorage.getItem('magie-move');
    if (s1 !== null) shakeLevel = parseInt(s1, 10);
    var s3 = localStorage.getItem('magie-size');
    if (s2 !== null) moveLevel = parseInt(s2, 10);
    if (s3 !== null) sizeLevel = parseInt(s3, 10);
  } catch (err) {}
  rngSize.value = sizeLevel; valSize.textContent = sizeLevel;
  card.style.width = sizeLevel + 'vw';
  rngSize.addEventListener('input', function () {
    sizeLevel = parseInt(rngSize.value, 10);
    valSize.textContent = sizeLevel;
    card.style.width = sizeLevel + 'vw';
    try { localStorage.setItem('magie-size', sizeLevel); } catch (err) {}
  });
  rngShake.value = shakeLevel; valShake.textContent = shakeLevel;
  rngMove.value = moveLevel; valMove.textContent = moveLevel;

  rngShake.addEventListener('input', function () {
    shakeLevel = parseInt(rngShake.value, 10);
    valShake.textContent = shakeLevel;
    try { localStorage.setItem('magie-shake', shakeLevel); } catch (err) {}
  });
  rngMove.addEventListener('input', function () {
    moveLevel = parseInt(rngMove.value, 10);
    valMove.textContent = moveLevel;
    try { localStorage.setItem('magie-move', moveLevel); } catch (err) {}
  });

  var bgBlob = null, cardBlob = null;
  var bgURL = null, cardURL = null;

  function applyImages() {
    if (bgBlob) {
      if (bgURL) URL.revokeObjectURL(bgURL);
      bgURL = URL.createObjectURL(bgBlob);
      bg.src = bgURL;
      stBg.textContent = 'Fond d\'écran : OK';
    }
    if (cardBlob) {
      if (cardURL) URL.revokeObjectURL(cardURL);
      cardURL = URL.createObjectURL(cardBlob);
      card.src = cardURL;
      stCard.textContent = 'PNG de la carte : OK';
    }
  }

  // ---------- Menu ----------
  function showMenu() {
    menu.style.display = 'flex';
    hideCard();
  }
  function hideMenu() {
    menu.style.display = 'none';
  }
  fileBg.addEventListener('change', function () {
    var f = fileBg.files[0];
    if (!f) return;
    bgBlob = f; dbSet('bg', f); applyImages();
  });
  fileCard.addEventListener('change', function () {
    var f = fileCard.files[0];
    if (!f) return;
    cardBlob = f; dbSet('card', f); applyImages();
  });
  btnOk.addEventListener('click', function () {
    if (!bgBlob || !cardBlob) {
      alert('Choisis les deux images avant de valider.');
      return;
    }
    hideMenu();
    requestMotion();
  });

  // ---------- Triple tap pour rouvrir le menu ----------
  var taps = [];
  var tapStart = null;
  document.addEventListener('touchstart', function (e) {
    if (menu.style.display === 'flex') return;
    if (perm.style.display === 'flex') return;
    if (e.touches.length !== 1) { tapStart = null; return; }
    var t = e.touches[0];
    tapStart = { x: t.clientX, y: t.clientY, time: Date.now() };
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tapStart) return;
    var ts = tapStart; tapStart = null;
    if (menu.style.display === 'flex' || perm.style.display === 'flex') return;
    var c = e.changedTouches[0];
    var now = Date.now();
    var moved = Math.abs(c.clientX - ts.x) + Math.abs(c.clientY - ts.y);
    if (now - ts.time > 350 || moved > 20) return;  // ce n'est pas un simple tap
    taps.push(now);
    taps = taps.filter(function (x) { return now - x < 700; });
    if (taps.length >= 3) { taps = []; showMenu(); return; }
    if (!cardVisible) showCard();  // un tap fait apparaitre la carte, comme une secousse
  }, { passive: true });

  // ---------- Capteurs de mouvement ----------
  var motionOn = false;
  function requestMotion() {
    if (motionOn) return;
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      perm.style.display = 'flex';
      perm.addEventListener('click', function once() {
        perm.removeEventListener('click', once);
        DeviceMotionEvent.requestPermission().then(function (s) {
          if (s === 'granted') startMotion();
          perm.style.display = 'none';
        }).catch(function () { perm.style.display = 'none'; });
      });
    } else {
      startMotion();
    }
  }
  function startMotion() {
    if (motionOn) return;
    motionOn = true;
    window.addEventListener('devicemotion', onMotion);
    window.addEventListener('deviceorientation', onOrient);
  }

  // ---------- Secousse ----------
  // Niveau 1 = très difficile à déclencher, niveau 10 = très sensible
  function shakeThreshold() { return 34 - shakeLevel * 2.2; }
  var lastShake = 0;
  function onMotion(e) {
    if (menu.style.display === 'flex') return;
    var a = e.accelerationIncludingGravity;
    if (!a) return;
    var force = Math.sqrt((a.x||0)*(a.x||0) + (a.y||0)*(a.y||0) + (a.z||0)*(a.z||0));
    var now = Date.now();
    if (force > shakeThreshold() && now - lastShake > 1200) {
      lastShake = now;
      if (!cardVisible) showCard();
    }
  }

  // ---------- Carte ----------
  var cardVisible = false;
  var tiltX = 0, tiltY = 0;
  var offX = 0, offY = 0;
  var baseGX = null, baseGY = null, rawGX = 0, rawGY = 0, gX = 0, gY = 0, velX = 0, velY = 0;
  var invertGravity = false;
  try { invertGravity = localStorage.getItem('magie-inv') === '1'; } catch (err) {}
  var btnInv = document.getElementById('btnInv');
  function updInv() { btnInv.textContent = 'Sens de la gravité : ' + (invertGravity ? 'inversé' : 'normal'); }
  updInv();
  btnInv.addEventListener('click', function () {
    invertGravity = !invertGravity;
    updInv();
    try { localStorage.setItem('magie-inv', invertGravity ? '1' : '0'); } catch (err) {}
  });
  // Niveau 0 = pas de gravité, niveau 5 = réaliste, niveau 10 = la carte glisse très vite
  function gravityForce() { return moveLevel * 220; }

  function render() {
    card.style.transform = 'translate(calc(-50% + ' + (offX + tiltX) + 'px), calc(-50% + ' + (offY + tiltY) + 'px))';
  }
  function showCard() {
    cardVisible = true;
    offX = 0; offY = 0;
    baseGX = null; baseGY = null; rawGX = 0; rawGY = 0; gX = 0; gY = 0; velX = 0; velY = 0;
    card.style.display = 'block';
    card.style.opacity = '0';
    card.style.transition = 'opacity 0.25s';
    render();
    requestAnimationFrame(function () { card.style.opacity = '1'; });
  }
  function hideCard() {
    cardVisible = false;
    card.style.display = 'none';
  }
  function onOrient(e) {
    if (!cardVisible) return;
    if (e.beta === null || e.gamma === null) return;
    var b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
    // direction de la gravité dans le repère de l'appareil
    var gxd = Math.sin(g) * Math.cos(b);
    var gyd = -Math.sin(b);
    // on la ramène dans le repère de l'écran selon l'orientation
    var ang = 0;
    try {
      if (screen.orientation && typeof screen.orientation.angle === 'number') ang = screen.orientation.angle;
      else ang = window.orientation || 0;
    } catch (err) {}
    ang = ((ang % 360) + 360) % 360;
    var sxg, syg;
    if (ang === 90) { sxg = -gyd; syg = -gxd; }
    else if (ang === 270) { sxg = gyd; syg = gxd; }
    else if (ang === 180) { sxg = -gxd; syg = gyd; }
    else { sxg = gxd; syg = -gyd; }
    if (invertGravity) { sxg = -sxg; syg = -syg; }
    // la position du téléphone quand la carte apparait sert de référence
    if (baseGX === null) { baseGX = sxg; baseGY = syg; }
    rawGX = sxg - baseGX;
    rawGY = syg - baseGY;
  }

  // ---------- Gravité : la carte glisse et tape sur les bords ----------
  var lastT = 0;
  function physics(t) {
    requestAnimationFrame(physics);
    var dt = (t - lastT) / 1000;
    lastT = t;
    if (!(dt > 0) || dt > 0.05) dt = 0.016;
    if (!cardVisible || dragging || menu.style.display === 'flex') return;
    gX += (rawGX - gX) * 0.2;
    gY += (rawGY - gY) * 0.2;
    var fx = Math.abs(gX) < 0.02 ? 0 : gX;
    var fy = Math.abs(gY) < 0.02 ? 0 : gY;
    var k = gravityForce();
    velX += fx * k * dt;
    velY += fy * k * dt;
    var damp = Math.pow(0.4, dt);
    velX *= damp; velY *= damp;
    offX += velX * dt;
    offY += velY * dt;
    var maxX = Math.max(0, window.innerWidth / 2 - card.offsetWidth / 2);
    var maxY = Math.max(0, window.innerHeight / 2 - card.offsetHeight / 2);
    if (offX > maxX) { offX = maxX; velX = -velX * 0.3; }
    else if (offX < -maxX) { offX = -maxX; velX = -velX * 0.3; }
    if (offY > maxY) { offY = maxY; velY = -velY * 0.3; }
    else if (offY < -maxY) { offY = -maxY; velY = -velY * 0.3; }
    render();
  }
  requestAnimationFrame(physics);

  // ---------- Glisser la carte pour la sortir ----------
  var dragging = false, sx = 0, sy = 0, startOffX = 0, startOffY = 0;
  card.addEventListener('touchstart', function (e) {
    if (!cardVisible) return;
    dragging = true;
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    startOffX = offX; startOffY = offY;
    card.style.transition = 'none';
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    var t = e.touches[0];
    offX = startOffX + (t.clientX - sx);
    offY = startOffY + (t.clientY - sy);
    render();
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function () {
    if (!dragging) return;
    dragging = false;
    velX = 0; velY = 0;
    var r = card.getBoundingClientRect();
    var W = window.innerWidth, H = window.innerHeight;
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // la carte disparait quand son centre approche du bord de l'écran
    if (cx < W * 0.12 || cx > W * 0.88 || cy < H * 0.10 || cy > H * 0.90) {
      hideCard();
    }
  });

  // ---------- Démarrage ----------
  Promise.all([dbGet('bg'), dbGet('card')]).then(function (r) {
    bgBlob = r[0] || null;
    cardBlob = r[1] || null;
    applyImages();
    if (bgBlob && cardBlob) {
      hideMenu();
      requestMotion();
    } else {
      showMenu();
    }
  });

  // ---------- Hors ligne ----------
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
})();
</script>
</body>
</html>
